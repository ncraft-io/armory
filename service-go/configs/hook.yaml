hook:
  enable: true
  minInterval: 0
  maxInterval: 0
  sqls:
    - |
      create table if not exists public.ods_residence
      (
        id           text not null primary key,
        kind         text,    -- 类型： 市属、区属、商品房
        zzlx2143     text,    -- 房屋性质
        szq1650      text,    -- 所在区
        jdmc2150     text,    -- 基地名称
        dkbh2250     text,    -- 地块编号
        kgbh2500     text,    -- 控规编号
        tzghydmj2511 numeric, -- 图则规划用地面积
        ghydmj2092   numeric, -- 规划用地面积
        sjydmj2206   numeric, -- 实际用地面积
        ghrjl2147    numeric, -- 规划容积率
        tzghjzmj2008 numeric, -- 图则规划建筑面积
        ghzzjzmj2265 numeric, -- 规划住宅建筑面积
        sjzzjzmj2206 numeric, -- 实际住宅建筑面积
        ghts1843     numeric, -- 规划套数
        sjts1635     numeric, -- 实际套数
        jszt1593     text,    -- 建设状态
        xqam2336     text,    -- 小区案名
        kgsj2156     timestamp with time zone, -- 开工时间
        jgsj2247     timestamp with time zone  -- 竣工时间
      );
    - |
      create table if not exists public.ods_supporting
      (
        id       text not null primary key,
        kind     text,    -- 类型： 商业、公建、绿化、湖泊、河流、道路
        szq1650  text,    -- 所在区
        jdmc2150 text,    -- 基地名称
        ptlx2106 text,    -- 配套类型
        ptdlx    text,    -- 配套大类型
        ptxlx    text,    -- 配套小类型
        dkbh2250 text,    -- 地块编号
        ydmj2134 numeric, -- 用地面积
        ghrjl2038  numeric, -- 容积率
        jzmj2394 numeric, -- 建筑面积
        xmmc1879 text,    -- 项目名称
        xmjz2185 text,    -- 项目进展
        mj2253   numeric, -- 面积
        zd2344   numeric, -- 长度
        kbmc2891 text,    -- 开办名称
        kgsj2156 timestamp with time zone, -- 开工时间
        jgsj2247 timestamp with time zone, -- 竣工时间
        kbsj2218 timestamp with time zone, -- 开办时间
        jgsj1623 timestamp with time zone  -- 接管时间
      );
    - |
      create table if not exists public.ads_residence_stat
      (
        id           text not null primary key,
        kind         text, -- 类型： 市属、区属、商品房
        zzlx2143     text, -- 住宅类型
        szq1650      text, -- 所在区
        jdmc2150     text, -- 基地名称
        
        total numeric, -- 项目总数
        built numeric, -- 项目已建数
        building numeric, -- 项目在建数
        unbuilt numeric, -- 项目未建数
        
        ghrjl_min    numeric, -- 规划容积率
        ghrjl_max    numeric, -- 规划容积率
        tzghydmj numeric, -- 图则规划用地面积
        tzghydmj_unbuilt numeric, -- 图则规划用地面积
        tzghydmj_building numeric, -- 图则规划用地面积
        tzghydmj_built numeric, -- 图则规划用地面积
        ghydmj   numeric, -- 规划用地面积
        ghydmj_unbuilt   numeric, -- 规划用地面积
        ghydmj_building   numeric, -- 规划用地面积
        ghydmj_built   numeric, -- 规划用地面积
        sjydmj   numeric, -- 实际用地面积
        sjydmj_unbuilt   numeric, -- 实际用地面积
        sjydmj_building   numeric, -- 实际用地面积
        sjydmj_built   numeric, -- 实际用地面积
        tzghjzmj numeric, -- 图则规划建筑面积
        tzghjzmj_unbuilt numeric, -- 图则规划建筑面积
        tzghjzmj_building numeric, -- 图则规划建筑面积
        tzghjzmj_built numeric, -- 图则规划建筑面积
        ghzzjzmj numeric, -- 规划住宅建筑面积
        ghzzjzmj_unbuilt numeric, -- 规划住宅建筑面积
        ghzzjzmj_building numeric, -- 规划住宅建筑面积
        ghzzjzmj_built numeric, -- 规划住宅建筑面积
        sjzzjzmj numeric, -- 实际住宅建筑面积
        sjzzjzmj_unbuilt numeric, -- 实际住宅建筑面积
        sjzzjzmj_building numeric, -- 实际住宅建筑面积
        sjzzjzmj_built numeric -- 实际住宅建筑面积
      );
    - |
      create table if not exists public.ads_supporting_stat
      (
        id           text not null primary key,
        kind            text,  -- 类型： 商业、公建、绿化、湖泊、河流、道路
        szq1650          text, -- 所在区
        jdmc2150         text, -- 基地名称
        ptlx2106         text, -- 配套类型
        
        ptdlx            text, -- 配套大类型
        ptxlx            text, -- 配套小类型
        
        total numeric, -- 项目总数
        built numeric, -- 项目已建数
        building numeric, -- 项目在建数
        unbuilt numeric, -- 项目未建数
        takeover numeric, -- 项目接管数
        open numeric, -- 项目开放数
        
        ghrjl_min          numeric, -- 容积率
        ghrjl_max          numeric, -- 容积率
        
        ydmj         numeric, -- 用地面积
        ydmj_unbuilt         numeric, -- 用地面积
        ydmj_building         numeric, -- 用地面积
        ydmj_built         numeric, -- 用地面积
        ydmj_open   numeric,
        jzmj         numeric, -- 建筑面积
        jzmj_unbuilt         numeric, -- 建筑面积
        jzmj_building         numeric, -- 建筑面积
        jzmj_built         numeric, -- 建筑面积
        jzmj_open   numeric,
        
        mj      numeric, -- 面积
        mj_unbuilt      numeric, -- 面积
        mj_building      numeric, -- 面积
        mj_built      numeric, -- 面积
        mj_takeover   numeric,
        mj_open numeric,
        zd       numeric, -- 长度
        zd_unbuilt       numeric, -- 长度
        zd_building       numeric, -- 长度
        zd_built       numeric, -- 长度
        zd_takeover   numeric,
        zd_open numeric
      );
    - TRUNCATE TABLE public.ods_residence;
    - TRUNCATE TABLE public.ods_supporting;
    - TRUNCATE TABLE public.ads_residence_stat;
    - TRUNCATE TABLE public.ads_supporting_stat;
    - |
      INSERT INTO public.ods_residence
          (id, kind, zzlx2143, szq1650, jdmc2150, dkbh2250, kgbh2500, tzghydmj2511, ghydmj2092, sjydmj2206, tzghjzmj2008, ghzzjzmj2265, sjzzjzmj2206, ghts1843, sjts1635, jszt1593, xqam2336, kgsj2156, jgsj2247 )
        SELECT id, '市属', zzlx2143, szq1650, jdmc2150, dkbh2250, kgbh2500, tzghydmj2511, ghydmj2092, sjydmj2206, tzghjzmj2008, ghzzjzmj2265, sjzzjzmj2206, ghts1843, sjts1635, jszt1593, xqam2336, kgsj2156, jgsj2247
        FROM public.residence_city_house
        ON CONFLICT(id)
        DO UPDATE SET
          kind = EXCLUDED.kind,
          zzlx2143 = EXCLUDED.zzlx2143,
          szq1650 = EXCLUDED.szq1650,
          jdmc2150 = EXCLUDED.jdmc2150,
          dkbh2250 = EXCLUDED.dkbh2250,
          kgbh2500 = EXCLUDED.kgbh2500,
