dbQuery:
  queries:
    - name: residence-cockpit-title
      sql: select 46  as base_count, t1.area as area, t2.building_area as residence_building_area, t3.building_area  as city_building_area from (select '1' as id, sum(ghydmj2092) as area from residence_base [where jdmc2150 in ?]) t1 inner join (select '1' as id, sum(tzghjzmj) as building_area from ads_residence_stat [where jdmc2150 in ?]) t2 on (t1.id = t2.id) inner join (select '1' as id, sum(tzghjzmj) as building_area from ads_residence_stat where kind = '市属' [and jdmc2150 in ?]) t3 on t2.id = t3.id
      parameters: [bases, bases, bases]
      columns:
        - name: base_count
          type: integer
          example: 46
        - name: area
          type: float
          example: 1500
        - name: residence_building_area
          type: float
          example: 6000
        - name: city_building_area
          type: float
          example: 3000
    - name: residence-cockpit-residence-1
      sql: select sum(tzghydmj_built) as area_built, sum(tzghydmj) as area, sum(tzghjzmj_built) as building_area_built, sum(tzghjzmj) as building_area from ads_residence_stat [where jdmc2150 in ?]
      parameters: [bases]
      columns:
        - name: area_built
          type: float
          example: 345
        - name: area
          type: float
          example: 400
        - name: building_area_built
          type: float
          example: 330
        - name: building_area
          type: float
          example: 400
    - name: residence-cockpit-residence-2
      sql: select t1.building_area as city_building_area, t2.building_area as town_building_area, t3.building_area as commercial_building_area from (select '1' as id, sum(tzghjzmj) as building_area from ads_residence_stat where kind = '市属' [and jdmc2150 in ?]) t1 inner join (select '1' as id, sum(tzghjzmj) as building_area from ads_residence_stat where kind = '区属' [and jdmc2150 in ?]) t2 on (t1.id = t2.id) inner join (select '1' as id, sum(tzghjzmj) as building_area from ads_residence_stat where kind = '商品房' [and jdmc2150 in ?]) t3 on t2.id = t3.id
      parameters: [bases, bases, bases]
      columns:
        - name: city_building_area
          type: float
          example: 345
        - name: town_building_area
          type: float
          example: 330
        - name: commercial_building_area
          type: float
          example: 330
    - name: residence-cockpit-residence-3
      sql: select sum(tzghjzmj_unbuilt) as building_area_unbuilt, sum(tzghjzmj_building) as building_area_building, sum(tzghjzmj_built) as building_area_built from ads_residence_stat [where jdmc2150 in ?]
      parameters: [bases]
      columns:
        - name: building_area_unbuilt
          type: float
          example: 345
        - name: building_area_building
          type: float
          example: 330
        - name: building_area_built
          type: float
          example: 330
    - name: residence-cockpit-residence-4
      sql: select t1.building_area_unbuilt as city_building_area_unbuilt, t1.building_area_building as city_building_area_building, t1.building_area_built as city_building_area_built, t2.building_area_unbuilt as town_building_area_unbuilt, t2.building_area_building as town_building_area_building, t2.building_area_built as town_building_area_built, t3.building_area_unbuilt as commercial_building_area_unbuilt, t3.building_area_building as commercial_building_area_building, t3.building_area_built as commercial_building_area_built from (select '1' as id, sum(tzghjzmj_unbuilt) as building_area_unbuilt, sum(tzghjzmj_building) as building_area_building, sum(tzghjzmj_built) as building_area_built from ads_residence_stat where kind = '市属' [and jdmc2150 in ?]) t1 inner join (select '1' as id, sum(tzghjzmj_unbuilt) as building_area_unbuilt, sum(tzghjzmj_building) as building_area_building, sum(tzghjzmj_built) as building_area_built from ads_residence_stat where kind = '区属' [and jdmc2150 in ?]) t2 on (t1.id = t2.id) inner join (select '1' as id, sum(tzghjzmj_unbuilt) as building_area_unbuilt, sum(tzghjzmj_building) as building_area_building, sum(tzghjzmj_built) as building_area_built from ads_residence_stat where kind = '商品房' [and jdmc2150 in ?]) t3 on t2.id = t3.id
      parameters: [bases, bases, bases]
      columns:
        - name: city_building_area_unbuilt
          type: float
          example: 345
        - name: city_building_area_building
          type: float
          example: 330
        - name: city_building_area_built
          type: float
          example: 330
        - name: town_building_area_unbuilt
          type: float
          example: 345
        - name: town_building_area_building
          type: float
          example: 330
        - name: town_building_area_built
          type: float
          example: 330
        - name: commercial_building_area_unbuilt
          type: float
          example: 345
        - name: commercial_building_area_building
          type: float
          example: 330
        - name: commercial_building_area_built
          type: float
          example: 330
    - name: residence-cockpit-residence-5
      sql: select t1.building_area_building as city_gy_building_area_building, t1.building_area_built as city_gy_building_area_built, t2.building_area_building as city_zs_building_area_building, t2.building_area_built as city_zs_building_area_built, t3.building_area_building as city_ps_building_area_building, t3.building_area_built as city_ps_building_area_built from (select '1' as id, sum(tzghjzmj_unbuilt) as building_area_unbuilt, sum(tzghjzmj_building) as building_area_building, sum(tzghjzmj_built) as building_area_built from ads_residence_stat where kind = '市属' and zzlx2143 = '共有产权保障房' [and jdmc2150 in ?]) t1 inner join (select '1' as id, sum(tzghjzmj_unbuilt) as building_area_unbuilt, sum(tzghjzmj_building) as building_area_building, sum(tzghjzmj_built) as building_area_built from ads_residence_stat where kind = '市属' and zzlx2143 = '市属征收安置房' [and jdmc2150 in ?]) t2 on (t1.id = t2.id) inner join (select '1' as id, sum(tzghjzmj_unbuilt) as building_area_unbuilt, sum(tzghjzmj_building) as building_area_building, sum(tzghjzmj_built) as building_area_built from ads_residence_stat where kind = '市属' and zzlx2143 = '配售型保障房' [and jdmc2150 in ?]) t3 on t2.id = t3.id
      parameters: [bases, bases, bases]
      columns:
        - name: city_gy_building_area_building
          type: float
          example: 330
        - name: city_gy_building_area_built
          type: float
          example: 330
        - name: city_zs_building_area_building
          type: float
          example: 330
        - name: city_zs_building_area_built
          type: float
          example: 330
        - name: city_ps_building_area_building
          type: float
          example: 330
        - name: city_ps_building_area_built
          type: float
          example: 330
    - name: residence-cockpit-supporting-1
      sql: |
        select t1.zd_built as road_built, t1.zd as road, t2.zd_built as river_built, t2.zd as river, t3.mj_built as lake_built,
               t3.mj as lake, t4.mj_built as green_built, t4.mj as green, t5.built as public_built, t5.total as public, t6.built as business_built, t6.total as business 
        from 
          (select '1' as id, COALESCE(sum(zd_built),0) + COALESCE(sum(zd_open),0) + COALESCE(sum(zd_takeover),0) as zd_built, sum(zd) as zd from public.ads_supporting_stat 
          where kind = '道路' [and jdmc2150 in ?]) t1 
        inner join 
          (select '1' as id, COALESCE(sum(zd_built),0) + COALESCE(sum(zd_open),0) + COALESCE(sum(zd_takeover),0) as zd_built, sum(zd) as zd from ads_supporting_stat 
           where kind = '河流' [and jdmc2150 in ?] ) t2 on (t1.id = t2.id) 
        inner join 
          (select '1' as id, COALESCE(sum(mj_built),0) + COALESCE(sum(mj_open),0) + COALESCE(sum(mj_takeover),0) as mj_built, sum(mj) as mj from ads_supporting_stat 
           where kind = '湖泊' [and jdmc2150 in ?] ) t3 on (t2.id = t3.id) 
        inner join 
          (select '1' as id, COALESCE(sum(mj_built),0) + COALESCE(sum(mj_open),0) + COALESCE(sum(mj_takeover),0) as mj_built, sum(mj) as mj from ads_supporting_stat 
           where kind = '绿化' [and jdmc2150 in ?]) t4 on (t3.id = t4.id) 
        inner join 
          (select '1' as id, COALESCE(sum(built),0) + COALESCE(sum(open),0) + COALESCE(sum(takeover),0) as built, sum(total) as total from ads_supporting_stat 
           where kind = '公建' [and jdmc2150 in ?]) t5 on (t4.id = t5.id) 
        inner join 
          (select '1' as id, COALESCE(sum(built),0) + COALESCE(sum(open),0) + COALESCE(sum(takeover),0) as built, sum(total) as total from ads_supporting_stat
           where ptlx2106 = '独立商业' [and jdmc2150 in ?]) t6 on (t5.id = t6.id)
      parameters: [bases, bases, bases, bases, bases, bases]
      columns:
        - name: road_built
          type: float
          example: 300
        - name: road
          type: float
          example: 330
        - name: river_built
          type: float
          example: 230
        - name: river
          type: float
          example: 330
        - name: lake
          type: float
          example: 330
        - name: lake_built
          type: float
          example: 230
        - name: green
          type: float
          example: 330
        - name: green_built
          type: float
          example: 230
        - name: public
          type: integer
          example: 330
        - name: public_built
          type: integer
          example: 300
        - name: business
          type: integer
          example: 330
        - name: business_built
          type: integer
          example: 300
    - name: residence-cockpit-supporting-2
      sql: select t1.total as public_education, t2.total as public_admin, t3.total as public_health, t4.total as public_elder, t5.total as public_culture, t6.total as public_market, t7.total as public_traffic, t8.total as public_other from (select '1' as id, sum(total) as total from public.ads_supporting_stat  where kind = '公建' and ptdlx = '教育' [and jdmc2150 in ?]) t1 inner join (select '1' as id, sum(total) as total from public.ads_supporting_stat where kind = '公建' and ptdlx = '行政' [and jdmc2150 in ?] ) t2 on (t1.id = t2.id) inner join (select '1' as id, sum(total) as total from public.ads_supporting_stat where kind = '公建' and ptdlx = '卫生' [and jdmc2150 in ?] ) t3 on (t2.id = t3.id) inner join (select '1' as id, sum(total) as total from public.ads_supporting_stat where kind = '公建' and ptdlx = '为老' [and jdmc2150 in ?]) t4 on (t3.id = t4.id) inner join (select '1' as id, sum(total) as total from public.ads_supporting_stat where kind = '公建' and ptdlx = '文体' [and jdmc2150 in ?]) t5 on (t4.id = t5.id) inner join (select '1' as id, sum(total) as total from public.ads_supporting_stat where kind = '公建' and ptdlx = '菜场' [and jdmc2150 in ?]) t6 on (t5.id = t6.id) inner join (select '1' as id, sum(total) as total from public.ads_supporting_stat where kind = '公建' and ptdlx = '交通' [and jdmc2150 in ?]) t7 on (t6.id = t7.id) inner join (select '1' as id, sum(total) as total from public.ads_supporting_stat where kind = '公建' and ptdlx = '其他' [and jdmc2150 in ?]) t8 on (t7.id = t8.id)
      parameters: [bases, bases, bases, bases, bases, bases, bases, bases]
      columns:
        - name: public_education
          type: integer
          example: 330
        - name: public_admin
          type: integer
          example: 330
        - name: public_health
          type: integer
          example: 330
        - name: public_elder
          type: integer
          example: 330
        - name: public_culture
          type: integer
          example: 330
        - name: public_market
          type: integer
          example: 330
        - name: public_traffic
          type: integer
          example: 330
        - name: public_other
          type: integer
          example: 330
    - name: residence-cockpit-supporting-3
      sql: select t1.public_built, t1.public_building, t1.public_unbuilt from (select COALESCE(sum(built),0) + COALESCE(sum(open),0) + COALESCE(sum(takeover),0) as public_built, sum(building) as public_building, sum(unbuilt) as public_unbuilt from public.ads_supporting_stat  where kind = '公建' [and jdmc2150 in ?]) t1;
      parameters: [bases]
      columns:  
        - name: public_built
          type: integer
          example: 330
        - name: public_building
          type: integer
          example: 330
        - name: public_unbuilt
          type: integer
          example: 330
    - name: residence-cockpit-supporting-4
      sql: select t1.building as public_education_building, t1.built as public_education_built, t1.unbuilt as public_education_unbuilt, t2.building as public_admin_building, t2.built as public_admin_built, t2.unbuilt as public_admin_unbuilt, t3.building as public_health_building, t3.built as public_health_built, t3.unbuilt as public_health_unbuilt, t4.building as public_elder_building, t4.built as public_elder_built, t4.unbuilt as public_elder_unbuilt, t5.building as public_culture_building, t5.built as public_culture_built, t5.unbuilt as public_culture_unbuilt, t6.building as public_market_building, t6.built as public_market_built, t6.unbuilt as public_market_unbuilt, t7.building as public_traffic_building, t7.built as public_traffic_built, t7.unbuilt as public_traffic_unbuilt, t8.building as public_other_building, t8.built as public_other_built, t8.unbuilt as public_other_unbuilt from (select '1' as id, sum(building) as building, COALESCE(sum(built),0) + COALESCE(sum(open),0) + COALESCE(sum(takeover),0) as built, sum(unbuilt) as unbuilt from public.ads_supporting_stat  where kind = '公建' and ptdlx = '教育' [and jdmc2150 in ?]) t1 inner join (select '1' as id, sum(building) as building, COALESCE(sum(built),0) + COALESCE(sum(open),0) + COALESCE(sum(takeover),0) as built, sum(unbuilt) as unbuilt from public.ads_supporting_stat where kind = '公建' and ptdlx = '行政' [and jdmc2150 in ?]) t2 on (t1.id = t2.id) inner join (select '1' as id, sum(building) as building, COALESCE(sum(built),0) + COALESCE(sum(open),0) + COALESCE(sum(takeover),0) as built, sum(unbuilt) as unbuilt from public.ads_supporting_stat where kind = '公建' and ptdlx = '卫生' [and jdmc2150 in ?]) t3 on (t2.id = t3.id) inner join (select '1' as id, sum(building) as building, COALESCE(sum(built),0) + COALESCE(sum(open),0) + COALESCE(sum(takeover),0) as built, sum(unbuilt) as unbuilt from public.ads_supporting_stat where kind = '公建' and ptdlx = '为老' [and jdmc2150 in ?]) t4 on (t3.id = t4.id) inner join (select '1' as id, sum(building) as building, COALESCE(sum(built),0) + COALESCE(sum(open),0) + COALESCE(sum(takeover),0) as built, sum(unbuilt) as unbuilt from public.ads_supporting_stat where kind = '公建' and ptdlx = '文体' [and jdmc2150 in ?]) t5 on (t4.id = t5.id) inner join (select '1' as id, sum(building) as building, COALESCE(sum(built),0) + COALESCE(sum(open),0) + COALESCE(sum(takeover),0) as built, sum(unbuilt) as unbuilt from public.ads_supporting_stat where kind = '公建' and ptdlx = '菜场' [and jdmc2150 in ?]) t6 on (t5.id = t6.id) inner join (select '1' as id, sum(building) as building, COALESCE(sum(built),0) + COALESCE(sum(open),0) + COALESCE(sum(takeover),0) as built, sum(unbuilt) as unbuilt from public.ads_supporting_stat where kind = '公建' and ptdlx = '交通' [and jdmc2150 in ?]) t7 on (t6.id = t7.id) inner join (select '1' as id, sum(building) as building, COALESCE(sum(built),0) + COALESCE(sum(open),0) + COALESCE(sum(takeover),0) as built, sum(unbuilt) as unbuilt from public.ads_supporting_stat where kind = '公建' and ptdlx = '其他' [and jdmc2150 in ?]) t8 on (t7.id = t8.id)
      parameters: [bases, bases, bases, bases, bases, bases, bases, bases]
      columns:
        - name: public_education_building
          type: integer
          example: 330
        - name: public_education_unbuilt
          type: integer
          example: 330
        - name: public_education_built
          type: integer
          example: 330
        - name: public_admin_building
          type: integer
          example: 330
        - name: public_admin_unbuilt
          type: integer
          example: 330
        - name: public_admin_built
          type: integer
          example: 330
        - name: public_health_building
          type: integer
          example: 330
        - name: public_health_unbuilt
          type: integer
          example: 330
        - name: public_health_built
          type: integer
          example: 330
        - name: public_elder_building
          type: integer
          example: 330
        - name: public_elder_unbuilt
          type: integer
          example: 330
        - name: public_elder_built
          type: integer
          example: 330
        - name: public_culture_building
          type: integer
          example: 330
        - name: public_culture_unbuilt
          type: integer
          example: 330
        - name: public_culture_built
          type: integer
          example: 330
        - name: public_market_building
          type: integer
          example: 330
        - name: public_market_unbuilt
          type: integer
          example: 330
        - name: public_market_built
          type: integer
          example: 330
        - name: public_traffic_building
          type: integer
          example: 330
        - name: public_traffic_unbuilt
          type: integer
          example: 330
        - name: public_traffic_built
          type: integer
          example: 330
        - name: public_other_building
          type: integer
          example: 330
        - name: public_other_unbuilt
          type: integer
          example: 330
        - name: public_other_built
          type: integer
          example: 330
    - name: residence-base
      sql: select t1.area as area, t1.building_area as building_area, t2.building_area as residence_building_area, t3.plot_ratio_min as residence_plot_ratio_min, t3.plot_ratio_max as residence_plot_ratio_max, t4.building_area_built as city_gy_building_area_built, t4.building_area_building as city_gy_building_area_building, t5.building_area_built as city_zs_building_area_built, t5.building_area_building as city_zs_building_area_building, t6.building_area_built as city_ps_building_area_built, t6.building_area_building as city_ps_building_area_building, t7.building_area_built as town_building_area_built, t7.building_area_building as town_building_area_building, t8.building_area_built as commercial_building_area_built, t8.building_area_building as commercial_building_area_building, t9.zd_built as road_built, t9.zd as road, t9.zd_building as road_building, t10.zd_built as river_built, t10.zd as river, t10.zd_building as river_building, t11.mj_built as lake_built, t11.mj as lake, t11.mj_building as lake_building, t12.mj_built as green_built, t12.mj as green, t12.mj_building as green_building, t13.total as public_education, t13.built as public_education_built, t13.building as public_education_building, t14.total as public_admin, t14.built as public_admin_built, t14.building as public_admin_building, t15.total as public_health, t15.built as public_health_built, t15.building as public_health_building, t16.total as public_elder, t16.built as public_elder_built, t16.building as public_elder_building, t17.total as public_culture, t17.built as public_culture_built, t17.building as public_culture_building, t18.total as public_market, t18.built as public_market_built, t18.building as public_market_building, t19.total as public_traffic, t19.built as public_traffic_built, t19.building as public_traffic_building, t20.total as public_other, t20.built as public_other_built, t20.building as public_other_building, t21.built as business_built, t21.building as business_building, t21.total as business, t22.built as public_built, t22.building as public_building, t22.total as public from (select '1' as id, sum(ghydmj2092) as area, sum(ghzjzmj2207) as building_area from public.residence_base [where jdmc2150 in ?]) t1 inner join (select '1' as id, sum(tzghjzmj) as building_area from public.ads_residence_stat where kind = '市属' [and jdmc2150 in ?]) t2 on (t1.id = t2.id) inner join (select '1' as id, min(ghrjl_min) as plot_ratio_min, max(ghrjl_max) as plot_ratio_max from public.ads_residence_stat [where jdmc2150 in ?]) t3 on (t2.id = t3.id) inner join (select '1' as id, sum(tzghjzmj_built) as building_area_built, sum(tzghjzmj_building) as building_area_building from ads_residence_stat where kind = '市属' and zzlx2143 = '共有产权保障房' [and jdmc2150 in ?]) t4 on (t3.id = t4.id) inner join (select '1' as id, sum(tzghjzmj_built) as building_area_built, sum(tzghjzmj_building) as building_area_building from ads_residence_stat where kind = '市属' and zzlx2143 = '市属征收安置房' [and jdmc2150 in ?]) t5 on (t4.id = t5.id) inner join (select '1' as id, sum(tzghjzmj_built) as building_area_built, sum(tzghjzmj_building) as building_area_building from ads_residence_stat where kind = '市属' and zzlx2143 = '配售型保障房' [and jdmc2150 in ?]) t6 on (t5.id = t6.id) inner join (select '1' as id, sum(tzghjzmj_built) as building_area_built, sum(tzghjzmj_building) as building_area_building from ads_residence_stat where kind = '区属' [and jdmc2150 in ?]) t7 on (t6.id = t7.id) inner join (select '1' as id, sum(tzghjzmj_built) as building_area_built,sum(tzghjzmj_building) as building_area_building from ads_residence_stat where kind = '商品房' [and jdmc2150 in ?]) t8 on (t7.id = t8.id) inner join (select '1' as id, COALESCE(sum(zd_built),0) + COALESCE(sum(zd_open),0) + COALESCE(sum(zd_takeover),0) as zd_built, sum(zd) as zd, sum(zd_building) as zd_building from public.ads_supporting_stat where kind = '道路' [and jdmc2150 in ?]) t9 on (t8.id = t9.id) inner join (select '1' as id, COALESCE(sum(zd_built),0) + COALESCE(sum(zd_open),0) + COALESCE(sum(zd_takeover),0) as zd_built, sum(zd) as zd, sum(zd_building) as zd_building from public.ads_supporting_stat where kind = '河流' [and jdmc2150 in ?]) t10 on (t9.id = t10.id) inner join (select '1' as id, COALESCE(sum(mj_built),0) + COALESCE(sum(mj_open),0) + COALESCE(sum(mj_takeover),0) as mj_built, sum(mj) as mj, sum(mj_building) as mj_building from public.ads_supporting_stat where kind = '湖泊' [and jdmc2150 in ?]) t11 on (t10.id = t11.id) inner join (select '1' as id, COALESCE(sum(mj_built),0) + COALESCE(sum(mj_open),0) + COALESCE(sum(mj_takeover),0) as mj_built, sum(mj) as mj, sum(mj_building) as mj_building from public.ads_supporting_stat where kind = '绿化' [and jdmc2150 in ?]) t12 on (t11.id = t12.id) inner join (select '1' as id, sum(total) as total, sum(building) as building, COALESCE(sum(built),0) + COALESCE(sum(open),0) + COALESCE(sum(takeover),0) as built from public.ads_supporting_stat  where kind = '公建' and ptdlx = '教育' [and jdmc2150 in ?]) t13 on (t12.id = t13.id) inner join (select '1' as id, sum(total) as total, sum(building) as building, COALESCE(sum(built),0) + COALESCE(sum(open),0) + COALESCE(sum(takeover),0) as built from public.ads_supporting_stat where kind = '公建' and ptdlx = '行政' [and jdmc2150 in ?]) t14 on (t13.id = t14.id) inner join (select '1' as id, sum(total) as total, sum(building) as building, COALESCE(sum(built),0) + COALESCE(sum(open),0) + COALESCE(sum(takeover),0) as built from public.ads_supporting_stat where kind = '公建' and ptdlx = '卫生' [and jdmc2150 in ?]) t15 on (t14.id = t15.id) inner join (select '1' as id, sum(total) as total, sum(building) as building, COALESCE(sum(built),0) + COALESCE(sum(open),0) + COALESCE(sum(takeover),0) as built from public.ads_supporting_stat where kind = '公建' and ptdlx = '为老' [and jdmc2150 in ?]) t16 on (t15.id = t16.id) inner join (select '1' as id, sum(total) as total, sum(building) as building, COALESCE(sum(built),0) + COALESCE(sum(open),0) + COALESCE(sum(takeover),0) as built from public.ads_supporting_stat where kind = '公建' and ptdlx = '文体' [and jdmc2150 in ?]) t17 on (t16.id = t17.id) inner join (select '1' as id, sum(total) as total, sum(building) as building, COALESCE(sum(built),0) + COALESCE(sum(open),0) + COALESCE(sum(takeover),0) as built from public.ads_supporting_stat where kind = '公建' and ptdlx = '菜场' [and jdmc2150 in ?]) t18 on (t17.id = t18.id) inner join (select '1' as id, sum(total) as total, sum(building) as building, COALESCE(sum(built),0) + COALESCE(sum(open),0) + COALESCE(sum(takeover),0) as built from public.ads_supporting_stat where kind = '公建' and ptdlx = '交通' [and jdmc2150 in ?]) t19 on (t18.id = t19.id) inner join (select '1' as id, sum(total) as total, sum(building) as building, COALESCE(sum(built),0) + COALESCE(sum(open),0) + COALESCE(sum(takeover),0) as built from public.ads_supporting_stat where kind = '公建' and ptdlx = '其他' [and jdmc2150 in ?]) t20 on (t19.id = t20.id) inner join (select '1' as id, sum(total) as total, sum(building) as building, COALESCE(sum(built),0) + COALESCE(sum(open),0) + COALESCE(sum(takeover),0) as built from public.ads_supporting_stat where kind = '商业' and ptlx2106 = '独立商业' [and jdmc2150 in ?]) t21 on (t20.id = t21.id) inner join (select '1' as id, sum(total) as total, sum(building) as building, COALESCE(sum(built),0) + COALESCE(sum(open),0) + COALESCE(sum(takeover),0) as built from public.ads_supporting_stat where kind = '公建' [and jdmc2150 in ?]) t22 on (t21.id = t22.id)
