    - name: residence-residence-wechat
      sql: select t1.building_area as city_gy_building_area, t1.building_area_unbuilt  as city_gy_building_area_unbuilt, t1.building_area_building as city_gy_building_area_building, t1.building_area_built as city_gy_building_area_built, t2.building_area as city_zs_building_area, t2.building_area_unbuilt  as city_zs_building_area_unbuilt, t2.building_area_building as city_zs_building_area_building, t2.building_area_built as city_zs_building_area_built, t3.building_area as city_ps_building_area, t3.building_area_unbuilt  as city_ps_building_area_unbuilt, t3.building_area_building as city_ps_building_area_building, t3.building_area_built as city_ps_building_area_built, t4.building_area as city_unknown_building_area, t5.building_area as town_building_area, t5.building_area_unbuilt  as town_building_area_unbuilt, t5.building_area_building as town_building_area_building, t5.building_area_built as town_building_area_built, t6.building_area as commercial_building_area, t6.building_area_unbuilt  as commercial_building_area_unbuilt, t6.building_area_building as commercial_building_area_building, t6.building_area_built as commercial_building_area_built, t7.building_area as city_building_area, t7.building_area_unbuilt  as city_building_area_unbuilt, t7.building_area_building as city_building_area_building, t7.building_area_built as city_building_area_built from (select '1' as id, sum(tzghjzmj) as building_area, sum(tzghjzmj_unbuilt) as building_area_unbuilt, sum(tzghjzmj_building) as building_area_building, sum(tzghjzmj_built) as building_area_built from ads_residence_stat where kind = '市属' and zzlx2143 = '共有产权保障房' [and jdmc2150 in ?]) t1 inner join (select '1' as id, sum(tzghjzmj) as building_area, sum(tzghjzmj_unbuilt) as building_area_unbuilt, sum(tzghjzmj_building) as building_area_building, sum(tzghjzmj_built) as building_area_built from ads_residence_stat where kind = '市属' and zzlx2143 = '市属征收安置房' [and jdmc2150 in ?]) t2 on (t1.id = t2.id) inner join (select '1' as id, sum(tzghjzmj) as building_area, sum(tzghjzmj_unbuilt) as building_area_unbuilt, sum(tzghjzmj_building) as building_area_building, sum(tzghjzmj_built) as building_area_built from ads_residence_stat where kind = '市属' and zzlx2143 = '配售型保障房' [and jdmc2150 in ?]) t3 on (t2.id = t3.id) inner join (select '1' as id, sum(tzghjzmj) as building_area from ads_residence_stat where kind = '市属' and zzlx2143 = '市属-未定义' [and jdmc2150 in ?]) t4 on (t3.id = t4.id) inner join (select '1' as id, sum(tzghjzmj) as building_area, sum(tzghjzmj_unbuilt) as building_area_unbuilt, sum(tzghjzmj_building) as building_area_building, sum(tzghjzmj_built) as building_area_built from ads_residence_stat where kind = '区属' [and jdmc2150 in ?]) t5 on (t4.id = t5.id) inner join (select '1' as id, sum(tzghjzmj) as building_area, sum(tzghjzmj_unbuilt) as building_area_unbuilt, sum(tzghjzmj_building) as building_area_building, sum(tzghjzmj_built) as building_area_built from ads_residence_stat where kind = '商品房' [and jdmc2150 in ?]) t6 on (t5.id = t6.id) inner join (select '1' as id, sum(tzghjzmj) as building_area, sum(tzghjzmj_unbuilt) as building_area_unbuilt, sum(tzghjzmj_building) as building_area_building, sum(tzghjzmj_built) as building_area_built from ads_residence_stat where kind = '市属' [and jdmc2150 in ?]) t7 on (t6.id = t7.id)
