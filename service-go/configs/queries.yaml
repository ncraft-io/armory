    - name: xddigital-residence-stat-info
      sql: |
        select t1.total as total, t2.average_price as average_price from
         (select '1' as id, count(*) as total
          from residence where ST_Within(geometry, ?)) t1
         inner join
         (select '1' as id, COALESCE(sum(average_price),0) / GREATEST(count(*),1) as average_price
          from residence where ST_Within(geometry, ?) and average_price > 0) t2 on (t1.id = t2.id)
      parameters: [ polygon, polygon ]
      columns:
        - name: total
          type: integer
          example: 30
        - name: average_price
          type: float
          example: 330
    - name: xddigital-residence-stat-top
      sql: select  name, average_price from residence where ST_Within(geometry, ?) order by average_price desc limit 10
      parameters: [ polygon ]
      columns:
        - name: name
          type: string
          example: 幸福小区
        - name: average_price
          type: float
          example: 330
    - name: xddigital-trade-stat-info
