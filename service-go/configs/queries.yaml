    - name: residence-supporting-1
      sql: |
        select t1.zd_built as road_built, t1.zd as road, t2.zd_built as river_built, t2.zd as river, t3.mj_built as lake_built, 
               t3.mj as lake, t4.mj_built as green_built, t4.mj as green, t5.built as public_built, t5.total as public, t6.built as business_built, t6.total as business 
        from 
          (select '1' as id, COALESCE(sum(zd_built),0) + COALESCE(sum(zd_open),0) + COALESCE(sum(zd_takeover),0) as zd_built, sum(zd) as zd 
           from public.ads_supporting_stat 
           where kind = '道路' [and jdmc2150 in ?]) t1 
        inner join 
          (select '1' as id, COALESCE(sum(zd_built),0) + COALESCE(sum(zd_open),0) + COALESCE(sum(zd_takeover),0) as zd_built, sum(zd) as zd 
           from ads_supporting_stat 
           where kind = '河流' [and jdmc2150 in ?] ) t2 on (t1.id = t2.id) 
        inner join 
          (select '1' as id, COALESCE(sum(mj_built),0) + COALESCE(sum(mj_open),0) + COALESCE(sum(mj_takeover),0) as mj_built, sum(mj) as mj 
           from ads_supporting_stat 
           where kind = '湖泊' [and jdmc2150 in ?] ) t3 on (t2.id = t3.id) 
        inner join 
          (select '1' as id, COALESCE(sum(mj_built),0) + COALESCE(sum(mj_open),0) + COALESCE(sum(mj_takeover),0) as mj_built, sum(mj) as mj 
           from ads_supporting_stat 
           where kind = '绿化' [and jdmc2150 in ?]) t4 on (t3.id = t4.id) 
        inner join (select '1' as id, COALESCE(sum(built),0) + COALESCE(sum(open),0) + COALESCE(sum(takeover),0) as built, sum(total) as total 
           from ads_supporting_stat 
           where kind = '公建' [and jdmc2150 in ?]) t5 on (t4.id = t5.id) 
        inner join (select '1' as id, COALESCE(sum(built),0) + COALESCE(sum(open),0) + COALESCE(sum(takeover),0) as built, sum(total) as total 
           from ads_supporting_stat 
           where kind = '商业' and ptlx2106 = '独立商业' [and jdmc2150 in ?]) t6 on (t5.id = t6.id)
      parameters: [bases, bases, bases, bases, bases, bases]
      columns:
        - name: road_built
          type: float
          example: 300
        - name: road
          type: float
          example: 330
        - name: river_built
          type: float
          example: 230
        - name: river
          type: float
          example: 330
        - name: lake
          type: float
          example: 330
        - name: lake_built
          type: float
          example: 230
        - name: green
          type: float
          example: 330
        - name: green_built
          type: float
          example: 230
        - name: public
          type: integer
          example: 330
        - name: public_built
          type: integer
          example: 300
        - name: business
          type: integer
          example: 330
        - name: business_built
          type: integer
          example: 300
    - name: residence-supporting-2
      sql: |
        select t1.total as public_education, t2.total as public_admin, t3.total as public_health, t4.total as public_elder, t5.total as public_culture,
               t6.total as public_market, t7.total as public_traffic, t8.total as public_other, t9.building as public_building, t9.built as public_built, 
               t9.unbuilt as public_unbuilt, t9.open as public_open, t9.takeover as public_takeover 
        from 
          (select '1' as id, sum(total) as total from public.ads_supporting_stat  where kind = '公建' and ptdlx = '教育' [and jdmc2150 in ?]) t1 
        inner join 
          (select '1' as id, sum(total) as total from public.ads_supporting_stat where kind = '公建' and ptdlx = '行政' [and jdmc2150 in ?] ) t2 on (t1.id = t2.id) 
        inner join 
          (select '1' as id, sum(total) as total from public.ads_supporting_stat where kind = '公建' and ptdlx = '卫生' [and jdmc2150 in ?] ) t3 on (t2.id = t3.id) 
        inner join 
          (select '1' as id, sum(total) as total from public.ads_supporting_stat where kind = '公建' and ptdlx = '为老' [and jdmc2150 in ?]) t4 on (t3.id = t4.id) 
        inner join 
          (select '1' as id, sum(total) as total from public.ads_supporting_stat where kind = '公建' and ptdlx = '文体' [and jdmc2150 in ?]) t5 on (t4.id = t5.id) 
        inner join 
          (select '1' as id, sum(total) as total from public.ads_supporting_stat where kind = '公建' and ptdlx = '菜场' [and jdmc2150 in ?]) t6 on (t5.id = t6.id) 
        inner join 
          (select '1' as id, sum(total) as total from public.ads_supporting_stat where kind = '公建' and ptdlx = '交通' [and jdmc2150 in ?]) t7 on (t6.id = t7.id) 
        inner join 
          (select '1' as id, sum(total) as total from public.ads_supporting_stat where kind = '公建' and ptdlx = '其他' [and jdmc2150 in ?]) t8 on (t7.id = t8.id) 
        inner join 
          (select '1' as id, sum(building) as building, COALESCE(sum(built),0) + COALESCE(sum(open),0) + COALESCE(sum(takeover),0) as built, sum(unbuilt) as unbuilt, sum(open) as open, COALESCE(sum(open),0) + COALESCE(sum(takeover),0) as takeover 
           from public.ads_supporting_stat 
           where kind = '公建' [and jdmc2150 in ?]) t9 on (t8.id = t9.id)
      parameters: [bases, bases, bases, bases, bases, bases, bases, bases, bases]
      columns:
        - name: public_education
          type: integer
          example: 330
        - name: public_admin
          type: integer
          example: 330
        - name: public_health
          type: integer
          example: 330
